<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>五子棋 · 在线对弈</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
:root{--bg:#0b1220;--panel:#131d2e;--panel2:#19263a;--line:#2b3b52;--text:#f7f9fc;--muted:#9badc5;--blue:#4e8cff;--green:#35c58b;--red:#ee6470;--gold:#e6a84e;--wood:#d7aa69;--woodline:#644621}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0,#182d51 0,var(--bg) 52%);color:var(--text)}
button,input,select{font:inherit}button{border:0;cursor:pointer}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #ffffff12;background:#09111ed9;backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px;font-weight:750}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#4e8cff,#8258ef);box-shadow:0 8px 28px #4e8cff44}.connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}.dot.on{background:var(--green);box-shadow:0 0 12px var(--green)}
.desktop-layout{max-width:1520px;margin:auto;padding:20px;display:grid;grid-template-columns:290px minmax(480px,1fr) 330px;gap:18px}.panel{background:#131d2ee8;border:1px solid #ffffff13;border-radius:18px;padding:17px;box-shadow:0 16px 44px #0004}.stack{display:flex;flex-direction:column;gap:14px}.section-title{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.badge{padding:4px 9px;border-radius:99px;background:#4e8cff1f;color:#8fb6ff;letter-spacing:0}
.player{display:flex;align-items:center;gap:11px;padding:12px;border-radius:13px;background:#ffffff08;border:1px solid #ffffff0d}.player.active{border-color:var(--blue);box-shadow:0 0 18px #4e8cff2c}.stone{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px}.black{background:#111827;color:white;box-shadow:inset 4px 4px 7px #ffffff23}.white{background:#eef3fb;color:#172033}.name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.timer-head,.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.timer-track{height:7px;background:#ffffff12;border-radius:5px;overflow:hidden}.timer-fill{height:100%;width:0;background:var(--blue);transition:width .2s linear}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#0a1322;color:var(--text);outline:none}.field:focus{border-color:var(--blue)}.btn{padding:10px 14px;border-radius:10px;font-weight:700;color:white;background:var(--blue)}.btn.secondary{background:#ffffff10;border:1px solid #ffffff17}.btn.danger{background:#ee647021;color:#ff9ca4;border:1px solid #ee647059}.btn:disabled{opacity:.42;cursor:not-allowed}.hint{font-size:12px;line-height:1.5;color:var(--muted)}
.board-page{min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px}.board-shell{width:min(100%,650px);aspect-ratio:1;padding:clamp(8px,2.4vw,22px);border:5px solid #5d4025;border-radius:15px;background:#8b6238;box-shadow:0 22px 55px #0008;display:grid;place-items:center}canvas{display:block;width:100%;height:100%;background:var(--wood);border-radius:5px;touch-action:manipulation}.board-status{width:min(100%,650px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:12px;background:#131d2ee8;border:1px solid #ffffff12;font-size:13px}.mobile-actions{display:none;width:100%;gap:8px}.mobile-actions .btn{flex:1}
.chat-panel{min-height:640px}.chat-list{height:390px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:3px}.message{padding:9px 10px;background:#ffffff08;border-radius:11px;font-size:14px;line-height:1.4}.message-head{display:flex;gap:7px;margin-bottom:4px;color:var(--muted);font-size:11px}.role{color:#8fb6ff}.chat-lock{padding:12px;border:1px dashed #ffffff22;border-radius:12px;background:#ffffff05}.online-list{display:flex;flex-wrap:wrap;gap:7px}.online-user{padding:5px 9px;border-radius:99px;background:#35c58b18;color:#7be0b8;font-size:12px}.online-user:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px}
.mobile-nav{display:none}.modal-bg{position:fixed;inset:0;background:#020711cc;display:none;place-items:center;padding:20px;z-index:50}.modal-bg.show{display:grid}.modal{width:min(420px,100%);padding:25px;border-radius:20px;background:var(--panel);border:1px solid #ffffff1c;box-shadow:0 30px 80px #000a}.modal h2{margin:0 0 9px}.modal p{color:var(--muted);line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;max-width:360px;padding:12px 16px;border-radius:12px;background:#21314a;border-left:4px solid var(--blue);box-shadow:0 15px 40px #0008;display:none;z-index:80}.toast.error{border-color:var(--red)}
@media(max-width:1250px) and (min-width:701px){.desktop-layout{grid-template-columns:260px 1fr}.chat-panel{grid-column:1/-1;min-height:auto}.chat-list{height:260px}}
@media(max-width:700px){
 body{overflow:hidden}.topbar{height:58px;padding:0 14px}.brand span:last-child{font-size:15px}.connection{font-size:12px}
 .desktop-layout{display:flex;width:200vw;height:calc(100dvh - 58px);max-width:none;margin:0;padding:0;gap:0;transition:transform .28s ease}.desktop-layout.show-chat{transform:translateX(-100vw)}
 .side-panel{display:none}.board-page,.chat-panel{width:100vw;min-width:100vw;height:calc(100dvh - 58px);padding:12px 12px 72px;overflow:auto}
 .board-page{justify-content:flex-start}.board-shell{width:min(calc(100vw - 24px),calc(100dvh - 235px));min-width:280px}.board-status{font-size:12px}.mobile-actions{display:flex}
 .chat-panel{border:0;border-radius:0;min-height:0;background:transparent;box-shadow:none}.chat-list{height:auto;min-height:260px;flex:1}
 .mobile-nav{position:fixed;display:grid;grid-template-columns:1fr 1fr;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));height:50px;background:#101b2df2;border:1px solid #ffffff17;border-radius:14px;padding:5px;z-index:25}.mobile-nav button{border-radius:10px;color:var(--muted);background:transparent;font-weight:700}.mobile-nav button.active{background:var(--blue);color:white}
 .toast{left:14px;right:14px;bottom:72px}
}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><div class="logo">五</div><span>在线五子棋</span></div>
 <div class="connection"><i id="wsDot" class="dot"></i><span id="wsText">连接中</span></div>
</header>
<main id="appRail" class="desktop-layout">
 <aside class="panel stack side-panel">
  <div class="section-title"><span>默认对局</span><span id="version" class="badge">v0</span></div>
  <div id="blackBox" class="player"><div class="stone black">黑</div><div><div id="blackName" class="name">等待入座</div><div class="meta">先手</div></div></div>
  <div id="whiteBox" class="player"><div class="stone white">白</div><div><div id="whiteName" class="name">等待入座</div><div class="meta">后手</div></div></div>
  <div class="stack">
   <div class="timer-head"><span id="turnText">等待对局开始</span><b id="timerText">--</b></div>
   <div class="timer-track"><div id="timerBar" class="timer-fill"></div></div>
  </div>
  <div class="section-title"><span>思考时间</span></div>
  <div class="row"><select id="timeMode" class="field" onchange="toggleCustomTime()"><option value="0">不限时</option><option value="30" selected>30 秒</option><option value="60">60 秒</option><option value="custom">自定义</option></select><input id="customTime" class="field" type="number" min="5" max="3600" value="90" hidden></div>
  <button class="btn secondary" onclick="saveTimeSetting()">保存时间设置</button>
  <button id="seatBtn" class="btn" onclick="takeSeat()">加入对局</button>
  <button id="surrenderBtn" class="btn danger" onclick="openSurrender()" disabled>认输</button>
  <button id="restartBtn" class="btn secondary" onclick="restartGame()" hidden>重新开局</button>
  <p class="hint">所有人进入后即可观战并查看在线名单。加入对局或聊天前，只需输入用户名，无需密码。</p>
 </aside>
 <section class="board-page">
  <div class="board-shell"><canvas id="board" width="600" height="600" aria-label="十五路五子棋棋盘"></canvas></div>
  <div class="board-status"><span id="mobileTurn">等待对局开始</span><span><b id="stoneCount">0</b> / 225</span><span id="mobileTimer">不限时</span></div>
  <div class="mobile-actions"><button id="mobileSeatBtn" class="btn" onclick="takeSeat()">加入对局</button><button id="mobileSurrenderBtn" class="btn danger" onclick="openSurrender()">认输</button><button id="mobileRestartBtn" class="btn secondary" onclick="restartGame()" hidden>再来一局</button></div>
  <div class="hint">手机端向左滑动查看聊天与在线用户</div>
 </section>
 <aside class="panel stack chat-panel">
  <div class="section-title"><span>聊天</span><span id="onlineCount" class="badge">0 人在线</span></div>
  <div id="onlineList" class="online-list"></div>
  <div id="chatList" class="chat-list"><div class="message"><div class="message-head"><span class="role">系统</span></div>欢迎观战。输入用户名后即可发言。</div></div>
  <div id="nameGate" class="chat-lock stack">
   <div class="hint">输入用户名启用聊天（无需密码）</div>
   <div class="row"><input id="username" class="field" maxlength="24" placeholder="你的用户名"><button class="btn" onclick="enableChat()">进入</button></div>
  </div>
  <div id="chatComposer" class="row" hidden><input id="chatInput" class="field" maxlength="200" placeholder="说点什么…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">发送</button></div>
 </aside>
</main>
<nav class="mobile-nav"><button id="navBoard" class="active" onclick="showMobilePage(false)">棋盘</button><button id="navChat" onclick="showMobilePage(true)">聊天</button></nav>
<div id="confirmModal" class="modal-bg"><div class="modal"><h2>确认认输？</h2><p>认输后本局将立即结束，对方获胜。</p><div class="row"><button class="btn secondary" onclick="closeModal('confirmModal')">继续下棋</button><button class="btn danger" onclick="confirmSurrender()">确认认输</button></div></div></div>
<div id="finishModal" class="modal-bg"><div class="modal"><h2 id="finishTitle">对局结束</h2><p id="finishReason"></p><div class="row"><button class="btn secondary" onclick="closeModal('finishModal')">查看棋盘</button><button id="finishRestartBtn" class="btn" onclick="restartGame()">重新开局</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const ROOM_ID="MAIN";
const BOARD_SIZE=15,PADDING=30,CELL=(600-PADDING*2)/(BOARD_SIZE-1);
let stomp=null,connected=false,token="",user={userId:"",username:"访客",isGuest:true},subscriptions=[],timerHandle=null,hover=null;
let state={status:"WAITING",stateVersion:0,currentTurn:null,turnDeadline:0,turnTimeSeconds:30,occupiedCount:0,board:Array.from({length:15},()=>Array(15).fill(0)),playerBlack:null,playerWhite:null,onlineUsers:[],lastMove:null};
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d");
const mobileDevice=()=>matchMedia("(max-width:700px)").matches||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
document.body.classList.toggle("is-mobile",mobileDevice());
addEventListener("resize",()=>document.body.classList.toggle("is-mobile",mobileDevice()));
addEventListener("load",async()=>{renderBoard();await becomeGuest();connect();});
async function becomeGuest(){const r=await fetch("/api/auth/guest?prefix=Viewer");const d=await r.json();token=d.token;user={...d,isGuest:true};}
async function enableChat(){
 const name=document.getElementById("username").value.trim();
 if(name.length<2){toast("用户名至少需要 2 个字符","error");return;}
 const r=await fetch("/api/auth/token?username="+encodeURIComponent(name));if(!r.ok){toast("用户名暂时不可用","error");return;}
 const d=await r.json();user={...d,isGuest:false};token=d.token;
 if(stomp&&connected)stomp.disconnect(()=>{connected=false;connect();});else connect();
 document.getElementById("nameGate").hidden=true;document.getElementById("chatComposer").hidden=false;
}
function connect(){
 const socket=new SockJS("/ws-gomoku");stomp=Stomp.over(socket);stomp.debug=null;
 stomp.connect({Authorization:"Bearer "+token},()=>{
  connected=true;connectionUi();
  stomp.subscribe("/user/queue/errors",m=>{const e=JSON.parse(m.body);toast(e.errorMessage||"操作失败","error")});
  stomp.subscribe("/user/queue/snapshot",m=>{applySnapshot(JSON.parse(m.body));subscribeRoom()});
  sendJoin(true);
 },()=>{connected=false;connectionUi();setTimeout(connect,2500)});
}
function subscribeRoom(){subscriptions.forEach(s=>{try{s.unsubscribe()}catch(e){}});subscriptions=[
 stomp.subscribe("/topic/room/"+ROOM_ID+"/state",m=>applyState(JSON.parse(m.body))),
 stomp.subscribe("/topic/room/"+ROOM_ID+"/gameplay",m=>gameEvent(JSON.parse(m.body))),
 stomp.subscribe("/topic/room/"+ROOM_ID+"/chat",m=>appendChat(JSON.parse(m.body)))
];}
function sendJoin(spectate){if(connected)stomp.send("/app/room.join",{},JSON.stringify({commandId:id("join"),roomId:ROOM_ID,spectate}));}
function takeSeat(){if(user.isGuest){showMobilePage(true);document.getElementById("username").focus();toast("先输入用户名，再加入对局");return;}sendJoin(false);}
function applyState(d){if(d.gameId&&d.gameId!==state.gameId&&d.occupiedCount===0){state.board=Array.from({length:15},()=>Array(15).fill(0));state.lastMove=null;closeModal("finishModal");}Object.assign(state,d);updateUi();}
function applySnapshot(d){Object.assign(state,d);state.board=d.board||state.board;state.lastMove=d.recentMoves?.at(-1)||null;const list=document.getElementById("chatList");d.recentChats?.forEach(appendChat);updateUi();renderBoard();}
function gameEvent(d){
 if(d.type==="MOVE_COMMITTED"){state.board[d.row][d.col]=d.color==="BLACK"?1:2;state.occupiedCount=d.stepNumber;state.stateVersion=d.stateVersion;state.currentTurn=d.nextTurn;state.turnDeadline=d.turnDeadline;state.lastMove=d;if(d.isGameOver){state.status="FINISHED";finish(d.winner,d.finishReason)}}
 if(d.type==="GAME_FINISHED"){state.status="FINISHED";state.stateVersion=d.stateVersion;finish(d.winner,d.finishReason)}
 updateUi();renderBoard();
}
function updateUi(){
 document.getElementById("version").textContent="v"+state.stateVersion;document.getElementById("stoneCount").textContent=state.occupiedCount||0;
 document.getElementById("blackName").textContent=state.playerBlack?.username||"等待入座";document.getElementById("whiteName").textContent=state.playerWhite?.username||"等待入座";
 document.getElementById("blackBox").classList.toggle("active",state.status==="PLAYING"&&state.currentTurn==="BLACK");document.getElementById("whiteBox").classList.toggle("active",state.status==="PLAYING"&&state.currentTurn==="WHITE");
 const turn=state.status==="PLAYING"?(state.currentTurn==="BLACK"?"黑方回合":"白方回合"):state.status==="FINISHED"?"本局已结束":state.status==="PAUSED"?"等待选手重连":"等待双方入座";
 document.getElementById("turnText").textContent=turn;document.getElementById("mobileTurn").textContent=turn;
 const mine=user.userId===state.playerBlack?.userId||user.userId===state.playerWhite?.userId;
 const playingMine=mine&&state.status==="PLAYING";document.getElementById("surrenderBtn").disabled=!playingMine;document.getElementById("mobileSurrenderBtn").disabled=!playingMine;
 document.getElementById("seatBtn").disabled=mine;document.getElementById("seatBtn").textContent=mine?"已入座":"加入对局";document.getElementById("mobileSeatBtn").disabled=mine;document.getElementById("mobileSeatBtn").textContent=mine?"已入座":"加入对局";
 const canRestart=mine&&state.status==="FINISHED";document.getElementById("restartBtn").hidden=!canRestart;document.getElementById("mobileRestartBtn").hidden=!canRestart;document.getElementById("finishRestartBtn").hidden=!canRestart;
 const mode=document.getElementById("timeMode");if(state.turnTimeSeconds==null)mode.value="0";else if([30,60].includes(state.turnTimeSeconds))mode.value=String(state.turnTimeSeconds);else{mode.value="custom";document.getElementById("customTime").value=state.turnTimeSeconds;}toggleCustomTime();
 const users=state.onlineUsers||[];document.getElementById("onlineCount").textContent=users.length+" 人在线";document.getElementById("onlineList").innerHTML=users.map(x=>'<span class="online-user">'+esc(x.username)+'</span>').join("")||'<span class="hint">暂无在线用户</span>';
 syncTimer();renderBoard();
}
function syncTimer(){clearInterval(timerHandle);const tick=()=>{if(!state.turnTimeSeconds){document.getElementById("timerText").textContent="不限时";document.getElementById("mobileTimer").textContent="不限时";document.getElementById("timerBar").style.width="100%";return;}if(!state.turnDeadline){const label=state.turnTimeSeconds+" 秒/步";document.getElementById("timerText").textContent=label;document.getElementById("mobileTimer").textContent=label;document.getElementById("timerBar").style.width="100%";return;}const left=Math.max(0,Math.ceil((state.turnDeadline-Date.now())/1000)),pct=Math.max(0,Math.min(100,left/state.turnTimeSeconds*100));document.getElementById("timerText").textContent=left+"s";document.getElementById("mobileTimer").textContent=left+"s";document.getElementById("timerBar").style.width=pct+"%";};tick();if(state.status==="PLAYING"&&state.turnTimeSeconds)timerHandle=setInterval(tick,200);}
function toggleCustomTime(){document.getElementById("customTime").hidden=document.getElementById("timeMode").value!=="custom";}
function saveTimeSetting(){if(!connected)return;let v=document.getElementById("timeMode").value;if(v==="custom")v=document.getElementById("customTime").value;stomp.send("/app/game.settings",{},JSON.stringify({commandId:id("settings"),roomId:ROOM_ID,turnTimeSeconds:Number(v)}));}
function openSurrender(){const mine=user.userId===state.playerBlack?.userId||user.userId===state.playerWhite?.userId;if(!mine||state.status!=="PLAYING"){toast("只有正在对局的棋手可以认输","error");return;}document.getElementById("confirmModal").classList.add("show");}
function confirmSurrender(){closeModal("confirmModal");stomp.send("/app/game.surrender",{},JSON.stringify({commandId:id("surrender"),roomId:ROOM_ID}));}
function restartGame(){closeModal("finishModal");if(connected)stomp.send("/app/game.restart",{},JSON.stringify({commandId:id("restart"),roomId:ROOM_ID}));}
function finish(winner,reason){const titles={BLACK:"黑方获胜",WHITE:"白方获胜"},reasons={FIVE_IN_A_ROW:"五子连珠",SURRENDER:"对方认输",TURN_TIMEOUT:"对方思考超时",DISCONNECT_TIMEOUT:"对方断线超时",DRAW:"棋盘已满，平局"};document.getElementById("finishTitle").textContent=titles[winner]||"本局平局";document.getElementById("finishReason").textContent=reasons[reason]||"对局已经结束";document.getElementById("finishModal").classList.add("show");}
function closeModal(id){document.getElementById(id).classList.remove("show");}
function sendChat(){if(user.isGuest){toast("请先输入用户名","error");return;}const input=document.getElementById("chatInput"),content=input.value.trim();if(!content||!connected)return;stomp.send("/app/chat.send",{},JSON.stringify({commandId:id("chat"),roomId:ROOM_ID,content}));input.value="";}
function appendChat(m){if(!m||!m.content)return;const div=document.createElement("div");div.className="message";div.innerHTML='<div class="message-head"><span class="role">'+esc(roleText(m.role))+'</span><b>'+esc(m.senderName||"")+'</b><span>'+new Date(m.timestamp).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+'</span></div><div>'+esc(m.content)+'</div>';const list=document.getElementById("chatList");list.appendChild(div);list.scrollTop=list.scrollHeight;}
function roleText(r){return r==="PLAYER_BLACK"?"黑方":r==="PLAYER_WHITE"?"白方":"观战";}
function connectionUi(){document.getElementById("wsDot").classList.toggle("on",connected);document.getElementById("wsText").textContent=connected?(user.isGuest?"在线观战":user.username+" · 在线"):"重新连接中";}
function renderBoard(){
 ctx.fillStyle="#d7aa69";ctx.fillRect(0,0,600,600);ctx.strokeStyle="#644621";ctx.lineWidth=1.2;
 for(let i=0;i<15;i++){const p=PADDING+i*CELL;ctx.beginPath();ctx.moveTo(PADDING,p);ctx.lineTo(570,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,PADDING);ctx.lineTo(p,570);ctx.stroke();}
 ctx.fillStyle="#644621";[[3,3],[3,11],[7,7],[11,3],[11,11]].forEach(([r,c])=>{ctx.beginPath();ctx.arc(PADDING+c*CELL,PADDING+r*CELL,4,0,Math.PI*2);ctx.fill()});
 for(let r=0;r<15;r++)for(let c=0;c<15;c++)if(state.board[r][c])drawStone(r,c,state.board[r][c]);
 if(state.lastMove){ctx.fillStyle="#ef4444";ctx.beginPath();ctx.arc(PADDING+state.lastMove.col*CELL,PADDING+state.lastMove.row*CELL,4,0,Math.PI*2);ctx.fill();}
}
function drawStone(r,c,v){const x=PADDING+c*CELL,y=PADDING+r*CELL,rad=CELL*.43,g=ctx.createRadialGradient(x-rad*.3,y-rad*.35,2,x,y,rad);if(v===1){g.addColorStop(0,"#566070");g.addColorStop(.6,"#172033");g.addColorStop(1,"#05070a")}else{g.addColorStop(0,"#fff");g.addColorStop(.75,"#eef2f7");g.addColorStop(1,"#aab5c5")}ctx.shadowColor="#0008";ctx.shadowBlur=6;ctx.shadowOffsetY=3;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();ctx.shadowColor="transparent";}
canvas.addEventListener("click",e=>{if(!connected||state.status!=="PLAYING")return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*600/rect.width,y=(e.clientY-rect.top)*600/rect.height,c=Math.round((x-PADDING)/CELL),r=Math.round((y-PADDING)/CELL);if(r<0||r>14||c<0||c>14||state.board[r][c])return;stomp.send("/app/game.move",{},JSON.stringify({commandId:id("move"),roomId:ROOM_ID,expectedStateVersion:state.stateVersion,row:r,col:c}));});
function showMobilePage(chat){document.getElementById("appRail").classList.toggle("show-chat",chat);document.getElementById("navBoard").classList.toggle("active",!chat);document.getElementById("navChat").classList.toggle("active",chat);}
let touchX=0,touchY=0;document.getElementById("appRail").addEventListener("touchstart",e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});document.getElementById("appRail").addEventListener("touchend",e=>{if(!mobileDevice())return;const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)showMobilePage(dx<0);},{passive:true});
function toast(text,type=""){const el=document.getElementById("toast");el.textContent=text;el.className="toast "+type;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",2800);}
function id(prefix){return prefix+"-"+Date.now()+"-"+Math.random().toString(16).slice(2)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
</body>
